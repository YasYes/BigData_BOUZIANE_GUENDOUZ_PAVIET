version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=cytech
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    networks:
      - spark-network


  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    networks:
      - spark-network


  spark-master:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_URL=spark://spark-master:7077
    ports:
      - "8081:8080" # Web UI Spark
      - "7077:7077" # Port Master
    networks:
      - spark-network

  spark-worker-1:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    networks:
      - spark-network

  spark-worker-2:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    networks:
      - spark-network

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow
    hostname: airflow
    user: "${AIRFLOW_UID:-1000}:0"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://cytech:password@postgres:5432/postgres
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_
      - WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - AIRFLOW__CORE__HOSTNAME_CALLABLE=airflow.utils.net.get_host_ip_address
    volumes:
      - ./ex06_airflow/dags:/opt/airflow/dags
      - ./ex05_ml_prediction_service:/opt/airflow/ml_scripts
      - ./jars:/opt/airflow/jars
      - ./data:/opt/airflow/data
      - ./ex03_sql_table_creation:/opt/airflow/ex03_sql_table_creation
      - ./ex04_dashboard:/opt/airflow/ex04_dashboard
      - ./reports:/opt/airflow/reports
    ports:
      - "8085:8080"
    command: standalone
    depends_on:
      - postgres
      - minio
      - spark-master
    networks:
      - spark-network

  prediction-api:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: prediction-ap
    entrypoint: ["python3", "-m", "streamlit", "run", "/opt/airflow/ml_scripts/app.py", "--server.port", "5000", "--server.address", "0.0.0.0"]
    volumes:
      - ./ex05_ml_prediction_service:/opt/airflow/ml_scripts
      - ./reports:/opt/airflow/reports
      - ./data:/opt/airflow/data
    ports:
      - "5000:5000"
    networks:
      - spark-network
    depends_on:
      - postgres

networks:
  spark-network:
    driver: bridge